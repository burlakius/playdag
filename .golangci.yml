# Pinned so that CI checks what a developer checks. The default set is
# deliberate: errcheck caught a report that reported success while failing to
# write itself, which is the class of bug this project cares about most.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused

  exclusions:
    rules:
      # A test that ignores an error fails on the assertion that follows it, so
      # the check adds noise rather than safety.
      - path: _test\.go
        linters:
          - errcheck
