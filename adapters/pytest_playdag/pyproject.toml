[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playdag-pytest"
version = "1.0.0"
description = "pytest adapter for the playdag orchestrator: context fixture and protocol reporter"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pytest>=7.4"]

[project.entry-points.pytest11]
playdag = "playdag_pytest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/playdag_pytest"]

[dependency-groups]
dev = ["pytest>=7.4"]
