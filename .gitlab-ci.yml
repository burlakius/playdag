stages:
  - build
  - experiment-e1
  - experiment-e2
  - experiment-e3
  - experiment-e4
  - compare

variables:
  SCRUM_REPO: "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/andrii.burlaka.dev-group/andrii.burlaka.dev-project.git"
  BASE_URL: "http://localhost:8000"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  tags:
    - experiment

cache:
  key: "python-deps-v1"
  paths:
    - .cache/pip

# ─── Stage 1: build orchestrator ──────────────────────────────────

build-orchestrator:
  stage: build
  image: golang:1.24
  script:
    - go test ./... -v
    - go test -race ./...
    - go build -o ./orchestrator ./cmd/orchestrator/
    - echo "Build successful"
    - ./orchestrator --help || true
  artifacts:
    name: "orchestrator-binary"
    paths:
      - orchestrator
    expire_in: 1 hour

# ─── Shared setup template ────────────────────────────────────────

.setup-env: &setup-env
  image: python:3.12
  before_script:
    # Clone scrum-board
    - git clone $SCRUM_REPO scrum-board
    - cd scrum-board

    # Install dependencies
    - pip install -r requirements.txt --quiet
    - pip install -r tests/requirements.txt --quiet
    - playwright install chromium
    - playwright install-deps chromium

    # Prepare database
    - python manage.py migrate --run-syncdb --no-input
    - mkdir -p logs/experiment
    - cd ..

    # Verify orchestrator
    - ls -la orchestrator
    - chmod +x orchestrator

# ─── Stage 2: E1 baseline (the prototype: no orchestration) ───────
#
# Runs the example suite the way Playwright is normally used: every test
# independent, every test signing in again. This is what the orchestrated runs
# are measured against, and without it "a significant reduction in time" is a
# claim with nothing on the other side of it.
#
# It uses the self-contained demo application rather than the private
# scrum-board, so the baseline is reproducible by anyone reading the results.

.demo-env: &demo-env
  image: mcr.microsoft.com/playwright:v1.61.1-jammy
  before_script:
    - npm ci
    - chmod +x orchestrator

e1-baseline:
  stage: experiment-e1
  <<: *demo-env
  needs: [build-orchestrator]
  timeout: 40 minutes
  script:
    - mkdir -p logs/experiment
    - |
      for i in $(seq 1 11); do
        echo "========== E1 baseline run $i/11 =========="
        node examples/demo-app/server.js 8000 &
        SERVER_PID=$!
        sleep 1

        START=$(date +%s.%N)
        npx playwright test tests/baseline.spec.ts --workers=1 \
          --config=examples/playwright/playwright.config.ts || true
        END=$(date +%s.%N)

        kill $SERVER_PID 2>/dev/null || true
        python3 - "$i" "$START" "$END" << 'PYTHON'
      import json, sys
      run, start, end = sys.argv[1:4]
      with open(f"logs/experiment/e1_run_{run}.json", "w") as f:
          json.dump({"config": "e1", "run": int(run),
                     "wall_clock_seconds": float(end) - float(start), "exit_code": 0}, f)
      PYTHON
      done
  artifacts:
    name: "e1-baseline-results"
    paths:
      - logs/experiment/e1_run_*.json
    expire_in: 7 days

# ─── Stage 3: E2 Sequential (only context sharing) ────────────────

e2-sequential:
  stage: experiment-e2
  <<: *setup-env
  needs: [build-orchestrator]
  timeout: 40 minutes
  script:
    - |
      for i in $(seq 1 10); do
        echo ""
        echo "========== E2 Sequential Run $i/10 =========="
        cd scrum-board
        python manage.py reset_test_db
        python manage.py seed_test_data --users 1

        # Start Django
        python manage.py runserver 0.0.0.0:8000 &
        SERVER_PID=$!
        sleep 3
        cd ..

        # Start orchestrator with workers=1
        ./orchestrator \
          -suite scrum-board/tests/suite.json \
          -basedir scrum-board \
          -baseurl http://localhost:8000 \
          -workers 1 \
          -report scrum-board/logs/experiment/e2_run_${i}.json \
          -snapshot scrum-board/logs/experiment/e2_snapshot_${i}.json \
          -timeout 300

        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        sleep 1
      done

    # Aggregate E2 results
    - |
      echo "=== DEBUG: e2_run_1.json structure ==="
      cat scrum-board/logs/experiment/e2_run_1.json | python3 -m json.tool || cat scrum-board/logs/experiment/e2_run_1.json
    - |
      python3 - << 'PYTHON'
      import json, glob, statistics, os

      files = sorted(glob.glob("scrum-board/logs/experiment/e2_run_*.json"))
      durations = []

      for f in files:
          with open(f) as fp:
              data = json.load(fp)
          dur = data.get("total_duration_ms", 0) / 1000
          passed = data.get("passed", 0)
          total = data.get("total_tests", 0)
          durations.append(dur)
          print(f"  {os.path.basename(f)}: {dur:.2f}s  ({passed}/{total} passed)")

      mean_val = statistics.mean(durations)
      summary = {
          "mode": "e2_sequential",
          "runs": len(durations),
          "durations_seconds": durations,
          "mean": round(mean_val, 3),
          "stdev": round(statistics.stdev(durations), 3),
          "min": round(min(durations), 3),
          "max": round(max(durations), 3),
          "cv_percent": round(statistics.stdev(durations) / mean_val * 100, 2) if mean_val > 0 else 0,
      }

      with open("scrum-board/logs/experiment/e2_summary.json", "w") as f:
          json.dump(summary, f, indent=2)

      print(f"\nE2 SEQUENTIAL SUMMARY")
      print(f"Mean: {summary['mean']:.2f}s  StDev: {summary['stdev']:.3f}s  CV: {summary['cv_percent']:.1f}%")
      PYTHON

  artifacts:
    name: "e2-sequential-results"
    paths:
      - scrum-board/logs/experiment/e2_run_*.json
      - scrum-board/logs/experiment/e2_summary.json
    expire_in: 7 days

# ─── Stage 4: E3 Parallel (context sharing + parallelism) ─────────

e3-parallel:
  stage: experiment-e3
  <<: *setup-env
  needs: [build-orchestrator]
  timeout: 40 minutes
  script:
    - |
      for i in $(seq 1 10); do
        echo ""
        echo "========== E3 Parallel Run $i/10 =========="
        cd scrum-board
        python manage.py reset_test_db
        python manage.py seed_test_data --users 1

        python manage.py runserver 0.0.0.0:8000 &
        SERVER_PID=$!
        sleep 3
        cd ..

        # Start orchestrator with workers=4
        ./orchestrator \
          -suite scrum-board/tests/suite.json \
          -basedir scrum-board \
          -baseurl http://localhost:8000 \
          -workers 4 \
          -report scrum-board/logs/experiment/e3_run_${i}.json \
          -snapshot scrum-board/logs/experiment/e3_snapshot_${i}.json \
          -timeout 300

        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        sleep 1
      done

    # Aggregate E3 results
    - |
      echo "=== DEBUG: e3_run_1.json structure ==="
      cat scrum-board/logs/experiment/e3_run_1.json | python3 -m json.tool || cat scrum-board/logs/experiment/e3_run_1.json
    - |
      python3 - << 'PYTHON'
      import json, glob, statistics, os

      files = sorted(glob.glob("scrum-board/logs/experiment/e3_run_*.json"))
      durations = []

      for f in files:
          with open(f) as fp:
              data = json.load(fp)
          dur = data.get("total_duration_ms", 0) / 1000
          passed = data.get("passed", 0)
          total = data.get("total_tests", 0)
          durations.append(dur)
          print(f"  {os.path.basename(f)}: {dur:.2f}s  ({passed}/{total} passed)")

      mean_val = statistics.mean(durations)
      summary = {
          "mode": "e3_parallel",
          "runs": len(durations),
          "durations_seconds": durations,
          "mean": round(mean_val, 3),
          "stdev": round(statistics.stdev(durations), 3),
          "min": round(min(durations), 3),
          "max": round(max(durations), 3),
          "cv_percent": round(statistics.stdev(durations) / mean_val * 100, 2) if mean_val > 0 else 0,
      }

      with open("scrum-board/logs/experiment/e3_summary.json", "w") as f:
          json.dump(summary, f, indent=2)

      print(f"\nE3 PARALLEL SUMMARY")
      print(f"Mean: {summary['mean']:.2f}s  StDev: {summary['stdev']:.3f}s  CV: {summary['cv_percent']:.1f}%")
      PYTHON

  artifacts:
    name: "e3-parallel-results"
    paths:
      - scrum-board/logs/experiment/e3_run_*.json
      - scrum-board/logs/experiment/e3_summary.json
    expire_in: 7 days

# ─── Stage 5: E4 fail-fast (a blocker breaks) ─────────────────────
#
# The login endpoint is broken on purpose. Both configurations meet the same
# failure; the difference is what they do about it - the orchestrated run stops,
# the baseline keeps running tests that cannot pass. The gap is the CI time
# early termination saves.

e4-failfast:
  stage: experiment-e4
  <<: *demo-env
  needs: [build-orchestrator]
  timeout: 40 minutes
  script:
    - mkdir -p logs/experiment
    - ./orchestrator extract -extractor playwright -basedir examples/playwright -o logs/experiment/suite.json
    - |
      for i in $(seq 1 11); do
        echo "========== E4 fail-fast run $i/11 =========="
        DEMO_BREAK=login node examples/demo-app/server.js 8000 &
        SERVER_PID=$!
        sleep 1

        START=$(date +%s.%N)
        ./orchestrator -executor playwright -suite logs/experiment/suite.json \
          -basedir examples/playwright -baseurl http://localhost:8000 \
          -workers 4 -fail-fast \
          -report logs/experiment/e4_report_${i}.json \
          -snapshot logs/experiment/e4_snapshot_${i}.json || true
        END=$(date +%s.%N)
        kill $SERVER_PID 2>/dev/null || true

        # The same broken application, without the orchestrator: every test runs
        # and every test fails.
        DEMO_BREAK=login node examples/demo-app/server.js 8000 &
        SERVER_PID=$!
        sleep 1

        BSTART=$(date +%s.%N)
        npx playwright test tests/baseline.spec.ts --workers=4 \
          --config=examples/playwright/playwright.config.ts || true
        BEND=$(date +%s.%N)
        kill $SERVER_PID 2>/dev/null || true

        python3 - "$i" "$START" "$END" "$BSTART" "$BEND" << 'PYTHON'
      import json, sys
      run, s1, e1, s2, e2 = sys.argv[1:6]
      for config, start, end in (("e4", s1, e1), ("e4b", s2, e2)):
          with open(f"logs/experiment/{config}_run_{run}.json", "w") as f:
              json.dump({"config": config, "run": int(run),
                         "wall_clock_seconds": float(end) - float(start), "exit_code": 0}, f)
      PYTHON
      done
  artifacts:
    name: "e4-failfast-results"
    paths:
      - logs/experiment/e4_run_*.json
      - logs/experiment/e4b_run_*.json
      - logs/experiment/e4_report_*.json
    expire_in: 7 days

# ─── Stage 6: Statistical comparison ──────────────────────────────

compare-all:
  stage: compare
  image: python:3.12
  needs: [e1-baseline, e2-sequential, e3-parallel, e4-failfast]
  script:
    - pip install scipy numpy matplotlib --quiet
    # The E2/E3 jobs report through the orchestrator's own report.json, which
    # analyze.py reads once every configuration is in the same directory.
    - mkdir -p logs/experiment
    - cp scrum-board/logs/experiment/e2_run_*.json logs/experiment/ 2>/dev/null || true
    - cp scrum-board/logs/experiment/e3_run_*.json logs/experiment/ 2>/dev/null || true
    - |
      python3 - << 'PYTHON'
      # The orchestrator's report.json is not a run file; give analyze.py the
      # shape it expects, so one script does the statistics for every job.
      import glob, json, os

      for config in ("e2", "e3"):
          for path in sorted(glob.glob(f"logs/experiment/{config}_run_*.json")):
              with open(path) as f:
                  data = json.load(f)
              if "wall_clock_seconds" in data:
                  continue  # already a run file
              run = int(os.path.basename(path).split("_run_")[1].split(".")[0])
              with open(path, "w") as f:
                  json.dump({
                      "config": config,
                      "run": run,
                      "wall_clock_seconds": data.get("total_duration_ms", 0) / 1000,
                      "exit_code": 0,
                      "total_tests": data.get("total_tests"),
                      "passed": data.get("passed"),
                      "failed": data.get("failed"),
                      "skipped": data.get("skipped"),
                      "worker_seconds": data.get("worker_seconds"),
                      "utilization": data.get("utilization"),
                      "workers": data.get("workers"),
                  }, f)
      PYTHON
    # Welch's t-test, Cohen's d and 95% confidence intervals, against the
    # measured E1 baseline rather than a constant written into this file.
    - python3 experiments/analyze.py logs/experiment -o logs/experiment

  artifacts:
    name: "experiment-final-results"
    paths:
      - logs/experiment/results.md
      - logs/experiment/results.json
      - logs/experiment/*.png
    expire_in: 30 days
